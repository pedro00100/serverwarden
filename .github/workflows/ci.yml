# Every push and pull request: formatting, static analysis, tests, known
# vulnerabilities, the web build, and the panel against a real sshd. On main,
# also the real image end to end (Podman, as in development).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The latest 1.27 patch every time, so security fixes in the
          # standard library land without anyone bumping a version.
          go-version: '1.27.x'
          check-latest: true
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - name: Static analysis
        run: go vet ./...
      - name: Tests (with the race detector)
        run: go test -race ./...
      - name: Known vulnerabilities in the code and its dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web build
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Panel binary against a real sshd
        run: make smoke

  e2e:
    if: github.event_name == 'push'
    needs: [test, smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Real image, a Debian server and Chromium, end to end
        run: make image install-e2e
