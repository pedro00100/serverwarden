# Weekly updates of every dependency, grouped so they arrive as one PR per
# ecosystem; CI must pass before anything is merged.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups: { go: { patterns: ['*'] } }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups: { web: { patterns: ['*'] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ['*'] } }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      # Node majors are moved by hand, from one LTS release to the next.
      - dependency-name: node
        update-types: ['version-update:semver-major']
